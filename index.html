<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mapa de Rutas Diarias</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="barra-superior">
  <div id="titulo">
    <strong>Rutas Diarias <span id="badge-admin" class="oculto">ADMIN</span></strong>
    <span id="fecha-ruta">--</span>
  </div>
  <select id="selector-camion">
    <option value="">Cargando...</option>
  </select>
</div>

<div id="info-superior">
  <div id="resumen-camion"></div>
  <div id="leyenda-colores"></div>
</div>

<div id="mapa"></div>

<div id="estado-carga">Cargando ruta del dia...</div>

<div id="estado-guardado" class="oculto"></div>

<div id="pantalla-codigo" class="oculto">
  <div id="caja-codigo">
    <strong>Codigo de acceso</strong>
    <p>Si el encargado te mando un link, abrelo y esto no deberia aparecer.
       Si te dio el codigo directo, pegalo aqui (una sola vez).</p>
    <input type="password" id="input-codigo" autocomplete="off" placeholder="Pega aqui el codigo">
    <button id="boton-codigo">Entrar</button>
    <p id="error-codigo" class="oculto">Codigo incorrecto o vencido, intenta de nuevo.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
